# Build and deploy Meridian Learn (VitePress) to GitHub Pages.
name: Deploy Meridian Learn

on:
  push:
    branches: [main, master]
    paths:
      - "lessons/**"
      - "docs/**"
      - "learn/**"
      - ".github/workflows/deploy-learn.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learn
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: learn/package-lock.json
      - name: Cache VitePress
        uses: actions/cache@v4
        with:
          path: learn/.vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('learn/**', 'lessons/**', 'docs/**', 'learn/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build with VitePress
        env:
          VITEPRESS_BASE: /agent-learn-adk/
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: learn/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
