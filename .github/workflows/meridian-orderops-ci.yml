# Meridian OrderOps — CI quality gates before image publish.
# Lesson 41 walks through extending this with deploy jobs.
name: meridian-orderops-ci

on:
  pull_request:
    paths:
      - "project/meridian_ops/**"
      - "project/meridian_orderops/**"
      - "project/meridian_ops/deploy/**"
      - ".github/workflows/meridian-orderops-ci.yml"
  push:
    branches: [main, master]

jobs:
  unit-and-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install -U pip
          pip install pytest pytest-asyncio
          # Domain tool tests should not require Gemini.
      - name: Tool unit tests
        env:
          PYTHONPATH: project
        run: |
          pytest project/meridian_ops/tests -q --ignore=project/meridian_ops/tests/test_orderops_workflow_runner.py || \
            pytest project/meridian_ops/tests/test_oms.py -q

  docker-build:
    runs-on: ubuntu-latest
    needs: unit-and-tools
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build -f project/meridian_ops/deploy/Dockerfile \
            -t meridian-orderops:ci-${{ github.sha }} .